name: Microservice CI/CD

on:
  push:
    branches:
      - master

jobs:
  docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SonarQube Scan - Backend
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.PAYMENT_BACKEND }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.projectKey=payment-backend   

      - name: SonarQube Scan - Frontend
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.PAYMENT_BACKEND }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=payment-frontend

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
    
      - name: Verify Trivy
        run: trivy --version

      - name: Trivy Filesystem Scan
        run: |
          trivy fs . \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 0
            
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Auth Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest backend/auth_service

      - name: Build Payment Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:latest backend/payment_service

      - name: Build Frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest frontend

      - name: Build Nginx
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/nginx:latest nginx

      - name: Trivy Scan - Auth Service
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 0 \
            ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest

      - name: Trivy Scan - Payment Service
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 0 \
            ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:latest

      - name: Trivy Scan - Frontend
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 0 \
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Trivy Scan - Nginx
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 0 \
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx:latest

      - name: Push Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/nginx:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ec2-user/micro-service

            git fetch origin
            git reset --hard origin/master

            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            docker compose -f docker-compose.yml pull

            # Trivy scans
            trivy image ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest --severity HIGH,CRITICAL
            trivy image ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:latest --severity HIGH,CRITICAL
            trivy image ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest --severity HIGH,CRITICAL
            trivy image ${{ secrets.DOCKERHUB_USERNAME }}/nginx:latest --severity HIGH,CRITICAL

            docker compose -f docker-compose.yml up -d --remove-orphans

            docker image prune -f
